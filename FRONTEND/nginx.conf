server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The bundle calls the API at /api on whichever host served the page. Forward it to the backend
    # container, so the build never hardcodes a backend host or port and works from any machine.
    location /api/ {
        # The container's own DNS server, filled in at startup (Docker: 127.0.0.11, Podman: the network
        # gateway). Re-resolves "backend" every 10 s, so a recreated backend container is found again.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
        set $backend http://backend:5000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
