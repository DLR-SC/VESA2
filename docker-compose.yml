services:
  arangodb:
    image: docker.io/arangodb:latest # fully qualified for Podman
    ports:
      - "8529:8529"
    environment:
      ARANGO_ROOT_PASSWORD: root
    volumes:
      - vesa_arango_data:/var/lib/arangodb3
    networks:
      - app-network
    # "always" (not "unless-stopped"): Podman's podman-restart.service only brings back "always" containers after a reboot.
    restart: always

  backend:
    build:
      context: ./BACKEND
    ports:
      - "5000:5000"
    environment:
      ARANGO_URL: http://arangodb:8529
      ARANGO_DB_NAME: vesa2db
      ARANGO_USER: root
      ARANGO_PASS: root
      NODE_PORT: 5000
    depends_on:
      - arangodb
    networks:
      - app-network
    restart: always

  frontend:
    build:
      context: ./FRONTEND
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  vesa_arango_data:
